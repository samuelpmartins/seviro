<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cover-test {
            height: 150px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .test-card {
            word-break: break-word;
            overflow-wrap: break-word;
        }
        
        .modal-dialog {
            margin: 1.75rem auto !important;
        }
        
        .modal.show {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="cover-test">
        <h1>Imagem de Capa (150px)</h1>
    </div>
    
    <div class="container mt-4">
        <div class="card test-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title mb-0" style="flex: 1; margin-right: 10px; word-break: break-word;">Hambúrguerartesanalcomqueijoemaiscoisas</h5>
                    <span class="badge bg-primary" style="white-space: nowrap;">R$ 25,90</span>
                </div>
                <p class="card-text" style="word-break: break-word; white-space: normal;">Hambúrguerartesanalcomqueijoemaiscoisas</p>
                <button class="btn btn-primary" onclick="showModal()">Adicionar ao Carrinho</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modal Centralizado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Este modal deve aparecer centralizado na tela!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showModal() {
            const modal = new bootstrap.Modal(document.getElementById('testModal'));
            modal.show();
        }
    </script>
</body>
</html>
